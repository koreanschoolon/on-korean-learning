<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>新規登録（確認用） | 韓国語教室ON 学習館</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; color: #24342f; background: #f5f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.65; }
    .container { max-width: 600px; margin: 0 auto; padding: 32px 18px 48px; }
    .brand { text-align: center; margin: 0 0 22px; }
    .brand h1 { margin: 0; color: #245c4a; font-size: 1.55rem; letter-spacing: .02em; }
    .brand p { margin: 2px 0 0; font-size: 1rem; color: #586b61; }
    .panel { padding: 26px 22px; background: white; border: 1px solid #dce4df; border-radius: 16px; box-shadow: 0 6px 22px #122c1910; }
    h2 { font-size: 1.32rem; margin: 0 0 8px; }
    .subtitle { margin: 0 0 22px; color: #4b6257; }
    .notice { border-left: 4px solid #a07e33; background: #fff8e6; padding: 12px 14px; border-radius: 7px; margin-bottom: 22px; font-size: .97rem; }
    .field { margin-bottom: 22px; }
    label, legend { display: block; font-weight: 700; font-size: 1.06rem; margin-bottom: 8px; }
    .optional { font-weight: 400; color: #586b61; font-size: .91rem; }
    input[type="text"], select { display:block; width:100%; border: 1.5px solid #80988a; border-radius: 9px; background:#fff; color:inherit; font: inherit; font-size: 1.06rem; padding: 12px 13px; min-height: 52px; }
    input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #327c65; outline-offset: 2px; }
    fieldset { border:0; padding:0; margin:0; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice { display:flex; align-items: center; gap: 8px; padding: 12px; margin: 0; border:1px solid #bacdc2; border-radius:10px; cursor:pointer; font-size:1rem; font-weight:500; }
    .choice input { accent-color:#287058; width:20px; height:20px; margin:0; flex-shrink:0; }
    .muted { color: #566a5f; font-size: .91rem; margin: 8px 0 0; }
    .status { color: #4c6158; margin: 8px 0 0; font-size: .93rem; min-height: 24px; }
    .status.error { color: #a12b29; font-weight: 650; }
    button { width: 100%; min-height: 53px; border:0; border-radius:10px; background:#23674f; color: #fff; font:inherit; font-weight:700; font-size:1.07rem; cursor:pointer; }
    button:hover { background: #19543f; }
    button:disabled { background: #819b8d; cursor:not-allowed; }
    #result { margin-top: 22px; padding: 16px; background: #edf6ef; border: 1px solid #b9d7c1; border-radius: 10px; }
    #result h3 { margin: 0 0 8px; font-size: 1.12rem; }
    #result p { margin: 6px 0; overflow-wrap: anywhere; }
    .footer { margin-top: 24px; text-align: center; }
    .footer a { color:#215d4a; font-weight:650; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) { .panel { padding: 22px 16px; } .choices { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <h1>韓国語教室ON</h1>
      <p>学習館</p>
    </header>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新規登録（画面確認用）</h2>
      <p class="subtitle">お名前と受講クラスを選んで、表示内容をご確認ください。</p>
      <div class="notice" role="note">
        <strong>現在は動作確認用のページです。</strong><br />
        「確認する」を押しても登録申請は送信されません。パスワードの入力も必要ありません。
      </div>
      <form id="registrationPreview">
        <div class="field">
          <label for="studentName">お名前</label>
          <input id="studentName" name="studentName" type="text" maxlength="50" autocomplete="name" placeholder="例：田中花子" required />
        </div>
        <fieldset class="field">
          <legend>受講形態</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="lessonType" value="group" checked />グループレッスン</label>
            <label class="choice"><input type="radio" name="lessonType" value="private" />個人レッスン</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="classId">受講クラス</label>
          <select id="classId" name="classId" disabled required><option value="">クラスを読み込んでいます…</option></select>
          <p class="status" id="loadStatus" role="status" aria-live="polite">クラス一覧を取得しています…</p>
          <p class="muted">受講クラスが見つからない場合は、先生にご連絡ください。</p>
        </div>
        <button type="submit" id="previewButton" disabled>内容を確認する</button>
      </form>
      <section id="result" hidden aria-live="polite">
        <h3>入力内容の確認</h3>
        <p><strong>お名前：</strong><span id="previewName"></span></p>
        <p><strong>受講クラス：</strong><span id="previewClass"></span></p>
        <p><strong>※ まだ登録申請は完了していません。</strong></p>
      </section>
    </section>
    <footer class="footer"><a href="./index.html">学習館のトップページへ戻る</a></footer>
  </main>
  <script>
    'use strict';
    const classSelect = document.getElementById('classId');
    const status = document.getElementById('loadStatus');
    const previewButton = document.getElementById('previewButton');
    const form = document.getElementById('registrationPreview');
    const result = document.getElementById('result');
    const radios = document.querySelectorAll('input[name="lessonType"]');
    let classList = [];

    function currentType() {
      return document.querySelector('input[name="lessonType"]:checked').value;
    }

    function renderClasses() {
      const options = classList.filter(item => item.lessonType === currentType());
      classSelect.replaceChildren();
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'クラスを選んでください';
      classSelect.appendChild(placeholder);
      options.forEach(item => {
        const option = document.createElement('option');
        option.value = item.classId;
        option.textContent = item.displayName;
        classSelect.appendChild(option);
      });
      classSelect.value = '';
      classSelect.disabled = options.length === 0;
      previewButton.disabled = options.length === 0;
      status.className = 'status';
      status.textContent = options.length ? `${options.length}件のクラスが表示されています。` : '該当するクラスがありません。先生にご連絡ください。';
      result.hidden = true;
    }

    radios.forEach(radio => radio.addEventListener('change', renderClasses));

    form.addEventListener('submit', event => {
      event.preventDefault();
      const studentName = document.getElementById('studentName').value.trim();
      const chosen = classList.find(item => item.classId === classSelect.value && item.lessonType === currentType());
      if (!studentName || !chosen) {
        form.reportValidity();
        return;
      }
      document.getElementById('previewName').textContent = studentName;
      document.getElementById('previewClass').textContent = chosen.displayName;
      result.hidden = false;
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    async function loadClasses() {
      try {
        const response = await fetch('./data/classes.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!data || !Array.isArray(data.classes)) throw new Error('形式が正しくありません');
        classList = data.classes.filter(item =>
          item && typeof item.classId === 'string' &&
          typeof item.displayName === 'string' &&
          (item.lessonType === 'group' || item.lessonType === 'private')
        );
        if (!classList.length) throw new Error('クラスがありません');
        renderClasses();
      } catch (error) {
        status.textContent = 'クラス一覧を読み込めませんでした。ページを再読み込みするか、先生にご連絡ください。';
        status.className = 'status error';
        classSelect.replaceChildren();
        const option = document.createElement('option');
        option.textContent = '読み込みエラー';
        classSelect.appendChild(option);
        previewButton.disabled = true;
        classSelect.disabled = true;
      }
    }
    loadClasses();
  </script>
</body>
</html>
